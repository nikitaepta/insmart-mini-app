<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Предложения</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>💰 Предложения</h1>

    <p class="subtitle">
        Выберите подходящее предложение
    </p>

    <div class="offer">

        <h2>МФО №1</h2>

        <div class="info">
            <p>💵 Сумма: <b>до 30 000 ₽</b></p>
            <p>📅 Срок: <b>до 30 дней</b></p>
            <p>📈 Ставка: <b>уточняется</b></p>
        </div>

        <button onclick="showOffer('МФО №1')">
            Подробнее
        </button>

    </div>


    <div class="offer">

        <h2>МФО №2</h2>

        <div class="info">
            <p>💵 Сумма: <b>до 50 000 ₽</b></p>
            <p>📅 Срок: <b>до 30 дней</b></p>
            <p>📈 Ставка: <b>уточняется</b></p>
        </div>

        <button onclick="showOffer('МФО №2')">
            Подробнее
        </button>

    </div>


    <div class="offer">

        <h2>МФО №3</h2>

        <div class="info">
            <p>💵 Сумма: <b>до 100 000 ₽</b></p>
            <p>📅 Срок: <b>до 60 дней</b></p>
            <p>📈 Ставка: <b>уточняется</b></p>
        </div>

        <button onclick="showOffer('МФО №3')">
            Подробнее
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
